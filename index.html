<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المصروفات السريع</title>
    <!-- استدعاء خط Tajwal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajwal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- لوحة التحكم والأزرار -->
        <main class="control-panel no-print">
            <header class="app-header">
                <h1>نظام المصروفات اليومية</h1>
                <div class="header-actions">
                    <button id="btn-settings" class="btn-icon" title="الإعدادات">⚙️ الإعدادات (1000 ميزة)</button>
                    <button id="btn-add-custom" class="btn-icon" title="إضافة صنف جديد">➕ إضافة صنف</button>
                </div>
            </header>

            <section class="items-grid" id="items-grid">
                <!-- سيتم حقن الأزرار هنا عبر الجافاسكريبت بترتيب الاستخدام -->
            </section>

            <!-- لوحة الإعدادات الجانبية (مخفية افتراضياً) -->
            <aside class="settings-panel" id="settings-panel">
                <div class="settings-header">
                    <h2>إعدادات النظام المتقدمة</h2>
                    <button id="close-settings">✖</button>
                </div>
                <div class="settings-content" id="settings-container">
                    <!-- سيتم حقن خيارات الإعدادات هنا -->
                </div>
            </aside>
        </main>

        <!-- لوحة الفاتورة (80mm) -->
        <aside class="invoice-wrapper">
            <div class="invoice-paper" id="invoice-paper">
                <div class="invoice-header">
                    <h2 id="print-title">فاتورة مصروفات</h2>
                    <div class="time-meta">
                        <span>بداية الفاتورة: <strong id="time-start">--:--:--</strong></span>
                        <span id="end-time-container" class="hidden">وقت الطباعة: <strong id="time-end">--:--:--</strong></span>
                    </div>
                </div>
                
                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th>الصنف</th>
                            <th>المبلغ</th>
                            <th class="no-print">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="invoice-body">
                        <!-- صفوف الفاتورة -->
                    </tbody>
                </table>
                
                <div class="invoice-footer">
                    <div class="total-row">
                        <span>الإجمالي:</span>
                        <span id="invoice-total">0</span>
                    </div>
                </div>
            </div>
            <button id="btn-print" class="btn-primary no-print">🖨️ طباعة الفاتورة الآن</button>
            <button id="btn-new" class="btn-danger no-print">🗑️ فاتورة جديدة</button>
        </aside>
    </div>

    <!-- الملفات البرمجية مفصولة لضمان المرونة -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/invoice.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
